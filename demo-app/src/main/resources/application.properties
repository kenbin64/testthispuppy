# The demo app's database: the PostgreSQL container from docker-compose.yml.
spring.datasource.url=jdbc:postgresql://localhost:5433/puppy_demo
spring.datasource.username=puppy
spring.datasource.password=puppy

# The tables come from schema.sql, never from Hibernate guessing.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=8080
