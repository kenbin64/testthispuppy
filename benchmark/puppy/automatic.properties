# Benchmark: TestThisPuppy with no expectations written by a person. Throwaway database, deleted afterwards.
db.mode=internal
db.schema=../bugzoo/src/main/resources/schema.sql
app.command=java -jar ../bugzoo/target/bugzoo-1.0.0.jar --server.port=8083 --spring.datasource.url={db.url} --spring.datasource.username={db.user} --spring.datasource.password={db.password}
app.baseUrl=http://localhost:8083
seed.rowsPerTable=3
report.file=report-automatic.json

http.cases=http-cases-none.txt
browser.pages=pages.txt
browser.headless=true
browser.checks=happy,wrong-input,sql-injection
browser.macros=no-macros

injection.readPath=/api/members/search?name=
injection.createPath=/api/members
injection.createBody={"name": "{payload}", "email": "inject@example.test"}

race.method=POST
race.path=/api/members
race.body={"name": "Racer {n}", "email": "racer{n}@example.test"}
race.table=member
race.requests=25

code.source=../bugzoo
code.checks=structure,bugs,practices,security
code.level=standard
code.failOn=high
code.skip=src/test

mutation.project=../bugzoo
mutation.target=com.bugzoo.*
mutation.level=standard
mutation.minScore=80
