# TestThisPuppy settings for the demo app.

# The database to seed, test against and restore.
db.url=jdbc:postgresql://localhost:5433/puppy_demo
db.user=puppy
db.password=puppy

# The only databases TestThisPuppy may touch, separated by commas. Anything else is refused.
db.allowed=jdbc:postgresql://localhost:5433/puppy_demo

# The running application.
app.baseUrl=http://localhost:8080

# How many dummy rows to put in each table.
seed.rowsPerTable=3

# The test tables (one row per test) and where the report goes.
http.cases=http-cases.txt
browser.pages=pages.txt
browser.headless=true
report.file=puppy-report.json

# Which browser checks to run: happy (good values) and wrong-input (each field wrong in turn).
# sql-injection is refused here on purpose: it only runs against the internal throwaway database.
browser.checks=happy,wrong-input

# Race-condition test: this many create requests released at the same instant; the table must grow by exactly that many.
race.method=POST
race.path=/api/customers
race.body={"name": "Racer {n}", "email": "racer{n}@example.test"}
race.table=customer
race.requests=25

# Macros: multi-step browser workflows, one .txt table per workflow, each run this many times with fresh dummy data.
browser.macros=macros
macro.repeat=3
