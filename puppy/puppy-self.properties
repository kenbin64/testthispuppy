# TestThisPuppy testing itself: its own source code and its own tests. No app, no database.
#   mvn -q exec:java -Dexec.args=puppy-self.properties
# A tool that checks other people's code should pass its own checks. Where it does not, the report says so.

db.mode=none
report.file=puppy-report-self.json

# Its own source, the whole repository (the tester and the demo app), tests left out.
code.source=..
code.checks=structure,bugs,practices,security
code.level=standard
code.failOn=high
code.skip=demo-app/src/test,puppy/src/test,demo-app/target,puppy/target
# A command-line tool's job is printing to the console, so this rule does not apply here.
code.ignoreRules=SystemPrintln

# Its own tests, tested. FailurePathsTest starts a throwaway database for each run, which is too slow to repeat
# for every planted bug, so it is left out here (it still runs in the normal build).
mutation.project=.
mutation.target=com.testthispuppy.*
mutation.level=standard
mutation.minScore=80
mutation.excludeTests=com.testthispuppy.FailurePathsTest
