# TestThisPuppy, code only: check the code itself and test its tests. No app is started and no database is used.
#   mvn -q exec:java -Dexec.args=puppy-code.properties
# The fix list is written to code-fixes.md, for a developer or an AI to work from.

db.mode=none
report.file=puppy-report-code.json

# Check the code: a folder, or a Git URL (copied to a temporary folder, read, then deleted).
code.source=../demo-app
# Which groups: any of structure, bugs, practices, security, style. Syntax is always checked.
code.checks=structure,bugs,practices,security
# quick | standard | thorough: only the most serious issues, more, or everything.
code.level=standard
# high | medium | any | never: which issues fail the run.
code.failOn=high
# Folders to leave out, comma separated, relative to the source.
code.skip=src/test
# Rules that do not apply to this project, by name, comma separated (for example SystemPrintln for a command-line tool).
code.ignoreRules=

# Test the tests (mutation testing). Leave blank to skip.
mutation.project=../demo-app
mutation.target=com.testthispuppy.demo.*
mutation.level=standard
mutation.minScore=80
mutation.excludeTests=
