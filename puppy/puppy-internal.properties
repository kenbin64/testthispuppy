# TestThisPuppy in INTERNAL mode: a throwaway database just for this run.
#   mvn -q exec:java -Dexec.args=puppy-internal.properties
# A fresh PostgreSQL starts in Docker, gets the schema below, the app starts pointed at it,
# the tests run, then the app stops and the database is deleted. Nothing remains.

db.mode=internal

# The tables to create in the throwaway database.
db.schema=../demo-app/src/main/resources/schema.sql

# How to start the app under test. {db.url}, {db.user} and {db.password} are filled with the throwaway database.
# It runs on port 8081 so it cannot collide with a copy already running on 8080.
app.command=java -jar ../demo-app/target/demo-app-1.0.0.jar --server.port=8081 --spring.datasource.url={db.url} --spring.datasource.username={db.user} --spring.datasource.password={db.password}
app.baseUrl=http://localhost:8081

seed.rowsPerTable=3
http.cases=http-cases.txt
browser.pages=pages.txt
browser.headless=true
report.file=puppy-report-internal.json

# Which browser checks to run: happy (good values), wrong-input (each field wrong in turn), sql-injection.
browser.checks=happy,wrong-input,sql-injection

# Where the SQL injection tests aim at the API. {payload} is replaced with each attack string.
injection.readPath=/api/customers/
injection.createPath=/api/customers
injection.createBody={"name": "{payload}", "email": "inject@example.test"}

# Race-condition test: this many create requests released at the same instant; the table must grow by exactly that many.
race.method=POST
race.path=/api/customers
race.body={"name": "Racer {n}", "email": "racer{n}@example.test"}
race.table=customer
race.requests=25

# Macros: multi-step browser workflows, one .txt table per workflow, each run this many times with fresh dummy data.
browser.macros=macros
macro.repeat=3

# Test the tests (mutation testing): plant small bugs in the app's code, one at a time, and check that the app's
# own tests catch them. Leave mutation.project blank to turn it off. Full output: mutation.log.
mutation.project=../demo-app
# Which classes get bugs planted (blank = the project's own package).
mutation.target=com.testthispuppy.demo.*
# quick | standard | thorough: how many kinds of bug to plant (more kinds take longer).
mutation.level=standard
# The % of planted bugs the tests must catch for this check to pass.
mutation.minScore=80
# Tests to leave out, comma separated (for example slow ones that start a database).
mutation.excludeTests=
