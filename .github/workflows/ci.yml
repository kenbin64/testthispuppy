# Runs every test on every push and pull request: the unit tests of both modules (including the error-path
# tests, which start throwaway PostgreSQL databases in Docker), then a full TestThisPuppy run in internal mode.
name: QA in a box

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit, controller, regression and error-path tests
        run: mvn -B install

      - name: Full run against a throwaway database
        working-directory: puppy
        run: mvn -B -q exec:java -Dexec.args=puppy-internal.properties

      - name: Keep the report and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy-report
          path: |
            puppy/puppy-report-internal.json
            puppy/puppy-analysis.md
            puppy/app-under-test.log
            puppy/macros/*.png
